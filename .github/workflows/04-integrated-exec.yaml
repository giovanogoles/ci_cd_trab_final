# CI de Nível 04 - Disparo dos testes dentro do pipeline de dev

name: 'Execução Integrada'

on:
  workflow_dispatch:

jobs:
  inspecao:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout do código
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
       node-version: 22.x

    - name: Instalando Yarn globalmente
      run: npm install -g yarn

    - name: Instalando dependências
      working-directory: prog-trabalho-final/testes
      run: yarn install

    - name: Checando Padronização do Código
      run: yarn lint


  unidade:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout do código
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
       node-version: 22.x

    - name: Instalando Yarn globalmente
      run: npm install -g yarn

    - name: Instalando dependências
      working-directory: prog-trabalho-final/testes
      run: yarn install

    - name: Executando Testes de Unidade
      run: yarn test

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [inspecao]

    
    steps:

    - name: Checkout do código
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
       node-version: 22.x

    - name: Instalando Yarn globalmente
      run: npm install -g yarn

    - name: Instalando dependências
      working-directory: prog-trabalho-final/testes
      run: yarn install

    - name: Instalando Playwright
      working-directory: prog-trabalho-final/testes
      run: yarn playwright install

    - name: Executando Testes E2E
      working-directory: prog-trabalho-final/testes
      run: yarn run e2e

    - name: Relatório Testes
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
          name: relatorio
          path: ./playwright-report

  deploy:
    runs-on: ubuntu-latest
    needs: [unidade, e2e-tests]

    steps:
      - name: 'Simulando o Deploy'
        run: echo "Simulando o deploy com sucesso"
